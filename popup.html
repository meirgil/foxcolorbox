<!DOCTYPE html>
<html>

<head>
    <title>Fox Color Box</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #fafafa;
            width: 220px;
            padding: 16px;
            color: #444;
        }

        header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
        }

        header img {
            width: 24px;
            height: 24px;
        }

        header h1 {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.3px;
            color: #333;
        }

        #button_list {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 7px;
            margin-bottom: 14px;
        }

        #button_list button {
            width: 100%;
            aspect-ratio: 1;
            border: 2px solid transparent;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease;
            font-size: 0;
        }

        #button_list button:hover {
            transform: scale(1.12);
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
        }

        #button_list button:active {
            transform: scale(0.97);
        }

        #button_list button.active {
            border-color: #555;
            box-shadow: 0 0 0 3px rgba(0,0,0,0.08);
        }

        footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 10px;
            border-top: 1px solid #eee;
        }

        .toggle-wrap {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .toggle-wrap label {
            font-size: 11px;
            color: #666;
            cursor: pointer;
            line-height: 1.3;
        }

        /* toggle switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 30px;
            height: 17px;
            flex-shrink: 0;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            inset: 0;
            background: #ccc;
            border-radius: 17px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .slider::before {
            content: "";
            position: absolute;
            width: 11px;
            height: 11px;
            left: 3px;
            bottom: 3px;
            background: white;
            border-radius: 50%;
            transition: transform 0.2s;
        }

        .switch input:checked + .slider {
            background: #a8d8a8;
        }

        .switch input:checked + .slider::before {
            transform: translateX(13px);
        }

        #reset {
            font-size: 11px;
            padding: 5px 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: white;
            color: #555;
            cursor: pointer;
            transition: background 0.12s, border-color 0.12s;
        }

        #reset:hover {
            background: #f0f0f0;
            border-color: #bbb;
        }

        #reset:active {
            background: #e5e5e5;
        }
    </style>
</head>

<body>
    <header>
        <img src="foxcolorbox.png" alt="Fox Color Box" />
        <h1>Fox Color Box</h1>
    </header>

    <div id="button_list"></div>

    <footer>
        <div class="toggle-wrap">
            <label class="switch">
                <input type="checkbox" id="change_new" checked />
                <span class="slider"></span>
            </label>
            <label for="change_new">Auto-color<br />new windows</label>
        </div>
        <button id="reset">Reset</button>
    </footer>

    <script src="popup.js"></script>
</body>

</html>
